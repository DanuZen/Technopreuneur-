<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="employer-flow-title employer-flow-desc" id="alur-employer-root">
        <title id="employer-flow-title">Diagram Alur Pengguna Pemberi Kerja</title>
        <desc id="employer-flow-desc">Flowchart proses employer mulai dari posting lowongan, moderasi, hingga meninjau pelamar yang terskor otomatis.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #alur-employer-root { --color-paper:       #f8fafc;
      --color-paper-2:     #ffffff;
      --color-ink:         #0f172a;
      --color-muted:       #475569;
      --color-soft:        #64748b;
      --color-accent:      #2563eb;
      --color-accent-tint: rgba(37, 99, 235, 0.08);
      --color-link:        #2563eb;
      --color-rule:        rgba(15, 23, 42, 0.12);
      --color-rule-solid:  #cbd5e1;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace; }
      #alur-employer-root { font-family: var(--font-sans); color: var(--color-ink); }
      #alur-employer-root .diagram-container { width: 100%; overflow-x: auto; background: var(--color-paper); border-radius: 12px; border: 1px solid var(--color-rule-solid); padding: 1.5rem; }
      #alur-employer-root .subtitle { font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 820px; }
      @media print {
#alur-employer-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="alur-employer-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="alur-employer-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>

          <pattern id="alur-employer-grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.06"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
        <rect width="100%" height="100%" fill="url(#alur-employer-grid-dots)" opacity="0.6"/>

        <!-- ROW 1 CONNECTORS (y ~ 90) -->
        <path d="M 160,90 H 218" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>
        <path d="M 390,90 H 448" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>
        <path d="M 620,90 H 678" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>

        <!-- Moderasi Decision -> Ditolak / Revisi (Loop back to Form) -->
        <path d="M 750,55 V 36 Q 750,28 742,28 H 540 Q 532,28 532,36 V 58" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#alur-employer-arrow)"/>
        <rect x="610" y="20" width="64" height="14" rx="2" fill="#f8fafc"/>
        <text x="642" y="30" fill="#ef4444" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">PERLU REVISI</text>

        <!-- Moderasi: Disetujui -> Status Aktif (Right and Down) -->
        <path d="M 820,90 H 870 Q 878,90 878,98 V 218 Q 878,226 870,226 H 828" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>
        <rect x="850" y="145" width="56" height="14" rx="2" fill="#f8fafc"/>
        <text x="878" y="155" fill="#10b981" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">DISETUJUI</text>

        <!-- ROW 2 CONNECTORS (y ~ 226) -->
        <path d="M 640,226 H 588" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>
        <path d="M 390,226 H 328" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>

        <!-- Tersedia di Matching -> Pelamar Masuk (Down) -->
        <path d="M 220,265 V 360 Q 220,368 228,368 H 258" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>

        <!-- ROW 3 CONNECTORS (y ~ 368) -->
        <path d="M 430,368 H 488" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>
        <path d="M 710,368 H 768" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>

        <!-- Status Updated -> Terminal Selesai (Down and right) -->
        <path d="M 860,405 V 450 Q 860,458 852,458 H 788" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#alur-employer-arrow-accent)"/>

        <!-- ROW 1 NODES -->
        <!-- Start Node -->
        <rect x="40" y="65" width="120" height="50" rx="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
        <text x="100" y="89" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Mulai</text>
        <text x="100" y="102" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Akun Employer</text>

        <!-- Step 1: Profil Perusahaan -->
        <rect x="220" y="60" width="170" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="230" y="68" width="50" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="255" y="77" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">PROFIL</text>
        <text x="230" y="96" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Profil Perusahaan</text>
        <text x="230" y="109" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Nama, Deskripsi, Website</text>

        <!-- Step 2: Form Pasang Lowongan [FOCAL 1] -->
        <rect x="450" y="55" width="170" height="70" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.4" fill-opacity="0.06"/>
        <rect x="460" y="63" width="50" height="12" rx="2" fill="#2563eb"/>
        <text x="485" y="72" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">POSTING</text>
        <text x="460" y="93" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Pasang Lowongan</text>
        <text x="460" y="107" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">Kriteria, Gaji, Work Type</text>
        <text x="460" y="117" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace">Lead: Wira (Frontend)</text>

        <!-- Decision: Moderasi Admin -->
        <polygon points="750,55 820,90 750,125 680,90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="750" y="87" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Moderasi Admin?</text>
        <text x="750" y="98" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Anti-Penipuan</text>

        <!-- ROW 2 NODES -->
        <!-- Step 3: Lowongan Disetujui / Aktif -->
        <rect x="640" y="195" width="180" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="650" y="203" width="50" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="675" y="212" fill="#10b981" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STATUS</text>
        <text x="650" y="231" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Status: Lowongan Aktif</text>
        <text x="650" y="245" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Tersimpan di Tabel jobs (DB)</text>

        <!-- Step 4: Worker Generate Embedding -->
        <rect x="390" y="195" width="190" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="400" y="203" width="55" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="427" y="212" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">AI WORKER</text>
        <text x="400" y="231" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Generate Vector Loker</text>
        <text x="400" y="245" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Embedding 1536 (Gemini API)</text>

        <!-- Step 5: Tersedia di Pencarian -->
        <rect x="130" y="195" width="190" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="140" y="203" width="60" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="170" y="212" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">PUBLIKASI</text>
        <text x="140" y="231" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Tersedia di Matching</text>
        <text x="140" y="245" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">pgvector HNSW siap diindeks</text>

        <!-- ROW 3 NODES -->
        <!-- Step 6: Pelamar Masuk -->
        <rect x="260" y="335" width="170" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="270" y="343" width="60" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="300" y="352" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">APPLICANT</text>
        <text x="270" y="371" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Pelamar Mengajukan</text>
        <text x="270" y="385" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Quick Apply dengan Profil CV</text>

        <!-- Step 7: Dashboard Review Pelamar [FOCAL 2] -->
        <rect x="490" y="330" width="220" height="75" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.4" fill-opacity="0.06"/>
        <rect x="500" y="338" width="65" height="12" rx="2" fill="#2563eb"/>
        <text x="532" y="347" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SCREENING</text>
        <text x="500" y="367" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Daftar Pelamar Terskor</text>
        <text x="500" y="383" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Terurut skor kecocokan AI tertinggi</text>
        <text x="500" y="395" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">Ringkasan AI &amp; Gap Analysis (Tanpa Bias)</text>

        <!-- Step 8: Update Status Pelamar -->
        <rect x="770" y="335" width="160" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="780" y="343" width="55" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="807" y="352" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">KEPUTUSAN</text>
        <text x="780" y="371" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Update Status</text>
        <text x="780" y="385" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Shortlisted / Rejected</text>

        <!-- Terminal: Selesai -->
        <rect x="660" y="435" width="120" height="46" rx="23" fill="#ffffff" stroke="#10b981" stroke-width="1.4"/>
        <text x="720" y="458" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Selesai</text>
        <text x="720" y="471" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Rekrutmen Efisien</text>
      </svg>
