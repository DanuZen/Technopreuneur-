<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1020 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jobseeker-flow-title jobseeker-flow-desc" id="alur-pencari-kerja-root">
        <title id="jobseeker-flow-title">Diagram Alur Pengguna Pencari Kerja</title>
        <desc id="jobseeker-flow-desc">Flowchart interaktif tahapan lengkap pencari kerja dari registrasi hingga melamar pekerjaan.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #alur-pencari-kerja-root { --color-paper:       #f8fafc;
      --color-paper-2:     #ffffff;
      --color-ink:         #0f172a;
      --color-muted:       #475569;
      --color-soft:        #64748b;
      --color-accent:      #2563eb;
      --color-accent-tint: rgba(37, 99, 235, 0.08);
      --color-link:        #2563eb;
      --color-rule:        rgba(15, 23, 42, 0.12);
      --color-rule-solid:  #cbd5e1;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace; }
      #alur-pencari-kerja-root { font-family: var(--font-sans); color: var(--color-ink); }
      #alur-pencari-kerja-root .diagram-container { width: 100%; overflow-x: auto; background: var(--color-paper); border-radius: 12px; border: 1px solid var(--color-rule-solid); padding: 1.5rem; }
      #alur-pencari-kerja-root .subtitle { font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 820px; }
      @media print {
#alur-pencari-kerja-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="alur-pencari-kerja-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="alur-pencari-kerja-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>

          <pattern id="alur-pencari-kerja-grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.06"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
        <rect width="100%" height="100%" fill="url(#alur-pencari-kerja-grid-dots)" opacity="0.6"/>

        <!-- ROW 1 CONNECTORS (y ~ 75) -->
        <!-- Start -> Consent Check -->
        <path d="M 160,75 H 228" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>

        <!-- Consent: Belum -> Modal PDP (Up and right) -->
        <path d="M 300,50 V 28 Q 300,20 308,20 H 420 Q 428,20 428,28 V 48" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#alur-pencari-kerja-arrow)"/>
        <rect x="330" y="12" width="60" height="14" rx="2" fill="#f8fafc"/>
        <text x="360" y="22" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">BELUM SETUJU</text>

        <!-- Modal PDP -> Upload Dropzone -->
        <path d="M 490,75 H 548" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#alur-pencari-kerja-arrow)"/>

        <!-- Consent: Sudah -> Upload Dropzone -->
        <path d="M 370,75 H 548" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>
        <rect x="424" y="67" width="56" height="14" rx="2" fill="#f8fafc"/>
        <text x="452" y="77" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SUDAH SETUJU</text>

        <!-- Upload -> Text Check (Down) -->
        <path d="M 640,110 V 178" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>

        <!-- ROW 2 CONNECTORS (y ~ 210) -->
        <!-- Text Check: Kosong/Scan -> Error Alert -> loops to Upload -->
        <path d="M 570,210 H 482" fill="none" stroke="#ef4444" stroke-width="1.2" marker-end="url(#alur-pencari-kerja-arrow)"/>
        <rect x="500" y="202" width="54" height="14" rx="2" fill="#f8fafc"/>
        <text x="527" y="212" fill="#ef4444" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SCAN / KOSONG</text>

        <path d="M 350,210 H 310 Q 302,210 302,202 V 118 Q 302,110 310,110 H 548" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#alur-pencari-kerja-arrow)"/>

        <!-- Text Check: Valid -> AI Worker Scoring -->
        <path d="M 710,210 H 778" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>
        <rect x="726" y="202" width="36" height="14" rx="2" fill="#f8fafc"/>
        <text x="744" y="212" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SUKSES</text>

        <!-- AI Worker -> Review Score (Down) -->
        <path d="M 870,245 V 318" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>

        <!-- ROW 3 CONNECTORS (y ~ 350) -->
        <!-- Review Score -> Decision Koreksi (Left) -->
        <path d="M 770,350 H 682" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>

        <!-- Koreksi Decision: Ya -> Form Edit Profil -->
        <path d="M 610,320 V 300 Q 610,292 602,292 H 480 Q 472,292 472,300 V 318" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#alur-pencari-kerja-arrow)"/>
        <rect x="520" y="284" width="40" height="14" rx="2" fill="#f8fafc"/>
        <text x="540" y="294" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PERLU EDIT</text>

        <!-- Form Edit Profil -> Lock Profil -->
        <path d="M 400,350 H 350" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#alur-pencari-kerja-arrow)"/>

        <!-- Koreksi Decision: Tidak -> Lock Profil -->
        <path d="M 540,350 H 350" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>
        <rect x="420" y="342" width="56" height="14" rx="2" fill="#f8fafc"/>
        <text x="448" y="352" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SUDAH SESUAI</text>

        <!-- Lock Profil -> Two-Stage Matching (Left) -->
        <path d="M 210,350 H 170 Q 162,350 162,358 V 460 Q 162,468 170,468 H 228" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>

        <!-- ROW 4 CONNECTORS (y ~ 470) -->
        <!-- Two-Stage Matching -> Feed Lowongan -->
        <path d="M 410,470 H 478" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>

        <!-- Feed Lowongan -> Decision Aksi Lowongan -->
        <path d="M 650,470 H 718" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>

        <!-- Decision Aksi: Internal -> Quick Apply (Up-right) -->
        <path d="M 790,445 V 428 Q 790,420 798,420 H 848" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>
        <rect x="794" y="412" width="46" height="14" rx="2" fill="#f8fafc"/>
        <text x="817" y="422" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">INTERNAL</text>

        <!-- Decision Aksi: Eksternal -> Redirect Jooble (Down-right) -->
        <path d="M 790,495 V 512 Q 790,520 798,520 H 848" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#alur-pencari-kerja-arrow)"/>
        <rect x="794" y="512" width="48" height="14" rx="2" fill="#f8fafc"/>
        <text x="818" y="522" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">EKSTERNAL</text>

        <!-- Quick Apply & Redirect -> Terminal Finish -->
        <path d="M 970,430 H 980 Q 988,430 988,438 V 462 Q 988,470 980,470 H 958" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#alur-pencari-kerja-arrow-accent)"/>
        <path d="M 970,510 H 980 Q 988,510 988,502 V 478 Q 988,470 980,470 H 958" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#alur-pencari-kerja-arrow)"/>

        <!-- ROW 1 NODES -->
        <!-- Start Terminal -->
        <rect x="40" y="50" width="120" height="50" rx="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
        <text x="100" y="74" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Mulai</text>
        <text x="100" y="87" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Login / Register</text>

        <!-- Decision 1: Consent PDP -->
        <polygon points="300,50 370,75 300,100 230,75" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="300" y="72" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Consent PDP?</text>
        <text x="300" y="83" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Persetujuan Data</text>

        <!-- Modal Consent PDP -->
        <rect x="410" y="50" width="80" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="450" y="73" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Modal PDP</text>
        <text x="450" y="86" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">User Setuju</text>

        <!-- Step: Upload Dropzone [FOCAL 1] -->
        <rect x="550" y="45" width="180" height="65" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.4" fill-opacity="0.06"/>
        <rect x="560" y="53" width="45" height="12" rx="2" fill="#2563eb"/>
        <text x="582" y="62" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">UNGGAH</text>
        <text x="560" y="80" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Unggah Berkas CV</text>
        <text x="560" y="94" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">PDF / DOCX (Maksimal 5 MB)</text>
        <text x="560" y="104" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace">Lead: Wira (Frontend)</text>

        <!-- ROW 2 NODES -->
        <!-- Error Alert: Scan Foto Kosong -->
        <rect x="350" y="185" width="130" height="50" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="415" y="206" fill="#e11d48" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Peringatan Scan</text>
        <text x="415" y="220" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Unggah File Teks Digital</text>

        <!-- Decision 2: Teks Terbaca? -->
        <polygon points="640,180 710,210 640,240 570,210" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="640" y="207" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Teks Terbaca?</text>
        <text x="640" y="218" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Validasi Karakter</text>

        <!-- Step: AI Worker Scoring -->
        <rect x="780" y="180" width="180" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="790" y="188" width="55" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="817" y="197" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">AI WORKER</text>
        <text x="790" y="215" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Ekstraksi &amp; Scoring</text>
        <text x="790" y="229" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">FastAPI · Gemini Free API</text>
        <text x="790" y="239" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace">Lead: Florensius Panca</text>

        <!-- ROW 3 NODES -->
        <!-- Step: Review Hasil & 5 Dimensi Skor -->
        <rect x="770" y="320" width="190" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="780" y="328" width="55" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="807" y="337" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SCORECARD</text>
        <text x="780" y="355" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Review Skor CV 0-100</text>
        <text x="780" y="369" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">5 Dimensi Nilai &amp; Saran AI</text>

        <!-- Decision 3: Perlu Koreksi Manual? -->
        <polygon points="610,320 680,350 610,380 540,350" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="610" y="347" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Koreksi Data?</text>
        <text x="610" y="358" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Periksa Akurasi</text>

        <!-- Step: Form Koreksi User -->
        <rect x="400" y="320" width="120" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="460" y="346" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Edit Form Profil</text>
        <text x="460" y="360" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Koreksi Keahlian/Teks</text>

        <!-- Step: Kunci Profil Final -->
        <rect x="210" y="320" width="140" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="220" y="328" width="50" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="245" y="337" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">VERIFIKASI</text>
        <text x="220" y="355" fill="#0f172a" font-size="10.5" font-family="'Geist', sans-serif" font-weight="600">Simpan Profil Final</text>
        <text x="220" y="369" fill="#10b981" font-size="7.5" font-family="'Geist Mono', monospace">Kunci Embedding Profil</text>

        <!-- ROW 4 NODES -->
        <!-- Step: Two-Stage Matching Engine [FOCAL 2] -->
        <rect x="230" y="440" width="180" height="65" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.4" fill-opacity="0.06"/>
        <rect x="240" y="448" width="65" height="12" rx="2" fill="#2563eb"/>
        <text x="272" y="457" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">AI MATCHING</text>
        <text x="240" y="475" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Two-Stage Engine</text>
        <text x="240" y="489" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">1. pgvector Kemiripan</text>
        <text x="240" y="499" fill="#475569" font-size="8" font-family="'Geist Mono', monospace">2. Evaluasi LLM Gap &amp; Skor</text>

        <!-- Step: Feed Rekomendasi Lowongan -->
        <rect x="480" y="440" width="170" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="490" y="448" width="50" height="12" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="515" y="457" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">FEED UI</text>
        <text x="490" y="475" fill="#0f172a" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Daftar Rekomendasi</text>
        <text x="490" y="489" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Terurut Skor Kecocokan</text>
        <text x="490" y="499" fill="#ef4444" font-size="7.5" font-family="'Geist Mono', monospace">Label Gap / Missing Skills</text>

        <!-- Decision 4: Aksi Pelamaran -->
        <polygon points="755,440 825,470 755,500 685,470" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="755" y="467" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Tipe Lowongan?</text>
        <text x="755" y="478" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Pilih Aksi</text>

        <!-- Step: Quick Apply Internal -->
        <rect x="850" y="405" width="120" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="910" y="425" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Quick Apply</text>
        <text x="910" y="438" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Kirim ke Employer</text>

        <!-- Step: Redirect Jooble Eksternal -->
        <rect x="850" y="490" width="120" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="910" y="510" fill="#0f172a" font-size="9.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Lamar di Sumber ↗</text>
        <text x="910" y="523" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Buka Portal Jooble</text>

        <!-- Finish Terminal -->
        <rect x="860" y="560" width="100" height="40" rx="20" fill="#ffffff" stroke="#10b981" stroke-width="1.4"/>
        <text x="910" y="584" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Selesai</text>
      </svg>
