        <text x="35" y="201" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Panca (AI Lead)</text>
        <rect x="245" y="176" width="225" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="255" y="191" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">Gemini 15 RPM · PyPDF Parser · Prompt 5D</text>

