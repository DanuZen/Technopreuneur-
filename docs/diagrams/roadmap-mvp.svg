<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1020 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gantt-title gantt-desc" id="roadmap-mvp-root">
        <title id="gantt-title">Roadmap Timeline MVP 6 Minggu CareerMatch AI</title>
        <desc id="gantt-desc">Gantt chart jadwal mingguan pengerjaan proyek dari setup hingga rilis beta tertutup.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #roadmap-mvp-root { --color-paper:       #f8fafc;
      --color-paper-2:     #ffffff;
      --color-ink:         #0f172a;
      --color-muted:       #475569;
      --color-soft:        #64748b;
      --color-accent:      #2563eb;
      --color-accent-tint: rgba(37, 99, 235, 0.08);
      --color-link:        #2563eb;
      --color-rule:        rgba(15, 23, 42, 0.12);
      --color-rule-solid:  #cbd5e1;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace; }
      #roadmap-mvp-root { font-family: var(--font-sans); color: var(--color-ink); }
      #roadmap-mvp-root .diagram-container { width: 100%; overflow-x: auto; background: var(--color-paper); border-radius: 12px; border: 1px solid var(--color-rule-solid); padding: 1.5rem; }
      #roadmap-mvp-root .subtitle { font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 820px; }
      @media print {
#roadmap-mvp-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="roadmap-mvp-grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.06"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
        <rect width="100%" height="100%" fill="url(#roadmap-mvp-grid-dots)" opacity="0.6"/>

        <!-- Phase zones behind rows -->
        <!-- FASE 1: RISET TEKNIS & CORE ENGINE (Minggu 1-2) -->
        <rect x="20" y="80" width="980" height="135" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="28" y="84" width="220" height="14" rx="2" fill="#f8fafc"/>
        <text x="138" y="95" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">FASE 1: RISET TEKNIS &amp; CORE ENGINE</text>

        <!-- FASE 2: LOWONGAN & MATCHING (Minggu 3-4) -->
        <rect x="20" y="230" width="980" height="135" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
