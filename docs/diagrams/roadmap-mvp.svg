        <!-- Release Gate Badge -->
        <rect x="850" y="535" width="120" height="26" rx="13" fill="#10b981"/>
        <text x="910" y="552" fill="#ffffff" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">GO-LIVE PILOT</text>
