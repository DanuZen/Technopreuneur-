        <line x1="360" y1="36" x2="360" y2="520" stroke="#0f172a" stroke-width="0.6" stroke-opacity="0.08"/>
        <line x1="480" y1="36" x2="480" y2="520" stroke="#0f172a" stroke-width="0.6" stroke-opacity="0.08"/>
        <line x1="600" y1="36" x2="600" y2="520" stroke="#0f172a" stroke-width="0.6" stroke-opacity="0.08"/>
        <line x1="720" y1="36" x2="720" y2="520" stroke="#0f172a" stroke-width="0.6" stroke-opacity="0.08"/>
        <line x1="840" y1="36" x2="840" y2="520" stroke="#0f172a" stroke-width="0.6" stroke-opacity="0.08"/>
        <line x1="960" y1="36" x2="960" y2="520" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>

