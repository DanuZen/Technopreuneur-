<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap Peluncuran MVP 6 Minggu — CareerMatch AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #f8fafc;
      --color-paper-2:     #ffffff;
      --color-ink:         #0f172a;
      --color-muted:       #475569;
      --color-soft:        #64748b;
      --color-accent:      #2563eb;
      --color-accent-tint: rgba(37, 99, 235, 0.08);
      --color-link:        #2563eb;
      --color-rule:        rgba(15, 23, 42, 0.12);
      --color-rule-solid:  #cbd5e1;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1140px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; background: var(--color-paper); border-radius: 12px; border: 1px solid var(--color-rule-solid); padding: 1.5rem; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.25rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 820px;
    }

    svg { width: 100%; min-width: 1000px; height: auto; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Gantt &amp; Timeline · CareerMatch AI</p>
    <h1>Roadmap Pengembangan MVP: Timeline 6 Minggu</h1>
    <p class="subtitle">Jadwal eksekusi paralel antara Frontend (Wira), Backend API (Gilang), dan Backend AI (Panca) menuju peluncuran Beta Tertutup (Closed Pilot).</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1020 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gantt-title gantt-desc">
        <title id="gantt-title">Roadmap Timeline MVP 6 Minggu CareerMatch AI</title>
        <desc id="gantt-desc">Gantt chart jadwal mingguan pengerjaan proyek dari setup hingga rilis beta tertutup.</desc>
        <defs>
          <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="rgba(15,23,42,0.06)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
        <rect width="100%" height="100%" fill="url(#grid-dots)" opacity="0.6"/>

        <!-- Phase zones behind rows -->
        <!-- FASE 1: SETUP & FONDASI (Minggu 1-2) -->
        <rect x="20" y="80" width="980" height="135" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <rect x="28" y="84" width="180" height="14" rx="2" fill="#f8fafc"/>
        <text x="118" y="95" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">FASE 1: SETUP &amp; CORE CV ENGINE</text>

        <!-- FASE 2: LOWONGAN & MATCHING (Minggu 3-4) -->
        <rect x="20" y="230" width="980" height="135" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <rect x="28" y="234" width="180" height="14" rx="2" fill="#f8fafc"/>
        <text x="118" y="245" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">FASE 2: JOBS &amp; MATCHING ENGINE</text>

        <!-- FASE 3: EMPLOYER, TESTING & LAUNCH (Minggu 5-6) -->
        <rect x="20" y="380" width="980" height="135" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <rect x="28" y="384" width="200" height="14" rx="2" fill="#f8fafc"/>
        <text x="128" y="395" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">FASE 3: SCREENING, AUDIT &amp; PILOT</text>

        <!-- TIME AXIS HEADERS (x=240 to 960 -> 720px / 6 = 120px per week) -->
        <!-- M1: 240-360, M2: 360-480, M3: 480-600, M4: 600-720, M5: 720-840, M6: 840-960 -->
        <text x="300" y="52" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Minggu 1</text>
        <text x="420" y="52" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Minggu 2</text>
        <text x="540" y="52" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Minggu 3</text>
        <text x="660" y="52" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Minggu 4</text>
        <text x="780" y="52" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Minggu 5</text>
        <text x="900" y="52" fill="#2563eb" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Minggu 6 (Pilot)</text>

        <!-- Timeline vertical separators -->
        <line x1="240" y1="36" x2="240" y2="520" stroke="rgba(15,23,42,0.18)" stroke-width="0.8"/>
        <line x1="360" y1="36" x2="360" y2="520" stroke="rgba(15,23,42,0.08)" stroke-width="0.6"/>
        <line x1="480" y1="36" x2="480" y2="520" stroke="rgba(15,23,42,0.08)" stroke-width="0.6"/>
        <line x1="600" y1="36" x2="600" y2="520" stroke="rgba(15,23,42,0.08)" stroke-width="0.6"/>
        <line x1="720" y1="36" x2="720" y2="520" stroke="rgba(15,23,42,0.08)" stroke-width="0.6"/>
        <line x1="840" y1="36" x2="840" y2="520" stroke="rgba(15,23,42,0.08)" stroke-width="0.6"/>
        <line x1="960" y1="36" x2="960" y2="520" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>

        <!-- Timeline horizontal header line -->
        <line x1="240" y1="62" x2="980" y2="62" stroke="rgba(15,23,42,0.20)" stroke-width="0.8"/>

        <!-- ROW 1.1: Frontend Wireframe & UI Setup -->
        <text x="35" y="125" fill="#0f172a" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">UI Setup &amp; Token Desain</text>
        <text x="35" y="137" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Wira (Frontend Lead)</text>
        <rect x="245" y="112" width="110" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="255" y="127" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">Next.js + Tailwind</text>

        <!-- ROW 1.2: Backend DB Setup & Auth -->
        <text x="35" y="157" fill="#0f172a" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">DB pgvector &amp; Auth JWT</text>
        <text x="35" y="169" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Gilang (Backend Lead)</text>
        <rect x="250" y="144" width="220" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="260" y="159" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">10 Tabel DB + JWT RBAC + PDP Consent</text>

        <!-- ROW 1.3: AI Extractor & LLM Profiler -->
        <text x="35" y="189" fill="#0f172a" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Ekstraksi CV &amp; LLM Scoring</text>
        <text x="35" y="201" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Panca (AI Lead)</text>
        <rect x="270" y="176" width="200" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="280" y="191" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">PyPDF · Docx · Prompt 5 Dimensi</text>

        <!-- ROW 2.1: Jobs CRUD & Ingestion Jooble -->
        <text x="35" y="275" fill="#0f172a" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">CRUD Lowongan &amp; Jooble API</text>
        <text x="35" y="287" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Gilang &amp; Panca</text>
        <rect x="485" y="262" width="160" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="495" y="277" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">Normalisasi &amp; Filter Loker</text>

        <!-- ROW 2.2: Two-Stage Matching Engine [FOCAL 1 - ACCENT] -->
        <text x="35" y="307" fill="#2563eb" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Two-Stage Matching Engine</text>
        <text x="35" y="319" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace">Panca (AI Lead)</text>
        <rect x="520" y="294" width="190" height="22" rx="4" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.4"/>
        <text x="530" y="309" fill="#2563eb" font-size="9" font-family="'Geist', sans-serif" font-weight="600">pgvector Cosine + LLM Gap Evaluator</text>

        <!-- ROW 2.3: UI Koreksi & Feed Rekomendasi -->
        <text x="35" y="339" fill="#0f172a" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Koreksi Profil &amp; Feed Loker</text>
        <text x="35" y="351" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Wira (Frontend Lead)</text>
        <rect x="560" y="326" width="150" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="570" y="341" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">Radial Scorecard &amp; Missing Skills</text>

        <!-- ROW 3.1: Employer Dashboard & Review -->
        <text x="35" y="425" fill="#0f172a" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Employer Dashboard &amp; Review</text>
        <text x="35" y="437" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Wira &amp; Gilang</text>
        <rect x="725" y="412" width="110" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="735" y="427" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">Pelamar Terskor &amp; Status</text>

        <!-- ROW 3.2: Sanitasi PII & Proteksi UU PDP -->
        <text x="35" y="457" fill="#0f172a" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Audit UU PDP &amp; Hapus Data</text>
        <text x="35" y="469" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Gilang &amp; Panca</text>
        <rect x="730" y="444" width="105" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="740" y="459" fill="#0f172a" font-size="9" font-family="'Geist', sans-serif" font-weight="500">Right to be Forgotten</text>

        <!-- ROW 3.3: Golden Dataset Benchmark & Beta Release [FOCAL 2] -->
        <text x="35" y="489" fill="#10b981" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Uji Coba &amp; Closed Pilot</text>
        <text x="35" y="501" fill="#10b981" font-size="8" font-family="'Geist Mono', monospace">Seluruh Tim (Gate Release)</text>
        <rect x="845" y="476" width="125" height="22" rx="4" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.4"/>
        <text x="855" y="491" fill="#10b981" font-size="9" font-family="'Geist', sans-serif" font-weight="600">Peluncuran Beta Tertutup</text>

        <!-- Release Gate Badge -->
        <rect x="850" y="535" width="120" height="26" rx="13" fill="#10b981"/>
        <text x="910" y="552" fill="#ffffff" font-size="9" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">GO-LIVE PILOT</text>
      </svg>
    </div>
  </div>
</body>
</html>
