<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1020 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" id="arsitektur-sistem-root">
        <title id="arch-title">Topologi Arsitektur CareerMatch AI</title>
        <desc id="arch-desc">Diagram komponen client web app, API server, worker antrean, database PostgreSQL pgvector, private storage, dan integrasi API AI eksternal.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #arsitektur-sistem-root { --color-paper:       #f8fafc;
      --color-paper-2:     #ffffff;
      --color-ink:         #0f172a;
      --color-muted:       #475569;
      --color-soft:        #64748b;
      --color-accent:      #2563eb;
      --color-accent-tint: rgba(37, 99, 235, 0.08);
      --color-link:        #2563eb;
      --color-rule:        rgba(15, 23, 42, 0.12);
      --color-rule-solid:  #cbd5e1;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace; }
      #arsitektur-sistem-root { font-family: var(--font-sans); color: var(--color-ink); }
      #arsitektur-sistem-root .diagram-container { width: 100%; overflow-x: auto; background: var(--color-paper); border-radius: 12px; border: 1px solid var(--color-rule-solid); padding: 1.5rem; }
      #arsitektur-sistem-root .subtitle { font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 800px; }
      @media print {
#arsitektur-sistem-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="arsitektur-sistem-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="arsitektur-sistem-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
          <marker id="arsitektur-sistem-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>

          <pattern id="arsitektur-sistem-grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.06"/>
          </pattern>
        </defs>

        <!-- Background Canvas -->
        <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
        <rect width="100%" height="100%" fill="url(#arsitektur-sistem-grid-dots)" opacity="0.6"/>

        <!-- ZONE 1: CLIENT TIER -->
        <rect x="40" y="40" width="240" height="540" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="52" y="44" width="130" height="14" rx="2" fill="#f8fafc"/>
        <text x="117" y="55" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.14em">CLIENT TIER (WEB)</text>

        <!-- ZONE 2: CORE SERVICES TIER -->
        <rect x="320" y="40" width="360" height="540" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="332" y="44" width="160" height="14" rx="2" fill="#f8fafc"/>
        <text x="412" y="55" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.14em">CORE BACKEND &amp; WORKER</text>

        <!-- ZONE 3: DATA & AI SERVICES TIER -->
        <rect x="720" y="40" width="260" height="540" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="732" y="44" width="150" height="14" rx="2" fill="#f8fafc"/>
        <text x="807" y="55" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.14em">DATA &amp; EXTERNAL AI</text>

        <!-- CONNECTORS (Drawn first so boxes sit above lines) -->
        <!-- Client -> Backend API (HTTPS) -->
        <path d="M 240,130 H 352" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arsitektur-sistem-arrow-accent)"/>
        <rect x="268" y="122" width="60" height="14" rx="2" fill="#f8fafc"/>
        <text x="298" y="132" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle">HTTPS/JSON</text>

        <!-- Client direct to Storage (Pre-signed Upload) -->
        <path d="M 240,150 H 290 Q 298,150 298,158 V 372 Q 298,380 306,380 H 752" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arsitektur-sistem-arrow)"/>
        <rect x="268" y="270" width="60" height="14" rx="2" fill="#f8fafc"/>
        <text x="298" y="280" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">DIRECT S3</text>

        <!-- Backend API -> DB (SQL / Prisma) -->
        <path d="M 570,130 H 752" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arsitektur-sistem-arrow)"/>
        <rect x="635" y="122" width="56" height="14" rx="2" fill="#f8fafc"/>
        <text x="663" y="132" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">SQL/TCP</text>

        <!-- Backend API -> Job Queue (Push Job) -->
        <path d="M 460,170 V 232" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arsitektur-sistem-arrow)"/>
        <rect x="424" y="194" width="72" height="14" rx="2" fill="#f8fafc"/>
        <text x="460" y="204" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">ENQUEUE JOB</text>

        <!-- Job Queue -> AI Worker (Consume Job) -->
        <path d="M 460,300 V 362" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arsitektur-sistem-arrow-accent)"/>
        <rect x="424" y="324" width="72" height="14" rx="2" fill="#f8fafc"/>
        <text x="460" y="334" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle">POLL / EVENT</text>

        <!-- AI Worker -> PostgreSQL pgvector -->
        <path d="M 570,410 H 670 Q 678,410 678,402 V 158 Q 678,150 686,150 H 752" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arsitektur-sistem-arrow)"/>
        <rect x="650" y="270" width="56" height="14" rx="2" fill="#f8fafc"/>
        <text x="678" y="280" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">COSINE &lt;=&gt;</text>

        <!-- AI Worker -> Private Storage (Read CV) -->
        <path d="M 570,420 H 752" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arsitektur-sistem-arrow)"/>
        <rect x="635" y="412" width="56" height="14" rx="2" fill="#f8fafc"/>
        <text x="663" y="422" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">FETCH DOC</text>

        <!-- AI Worker -> Gemini LLM / Embedding API -->
        <path d="M 570,440 H 670 Q 678,440 678,448 V 492 Q 678,500 686,500 H 752" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arsitektur-sistem-arrow-accent)"/>
        <rect x="645" y="482" width="66" height="14" rx="2" fill="#f8fafc"/>
        <text x="678" y="492" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle">REST / JSON</text>

        <!-- NODE 1: Client Web (Next.js) -->
        <rect x="60" y="90" width="180" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="70" y="100" width="60" height="13" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="100" y="109" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">FRONTEND</text>
        <text x="70" y="132" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Next.js Web App</text>
        <text x="70" y="148" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">React 18 · Tailwind · Vercel</text>
        <text x="70" y="160" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace">Lead: Wira F. Ramadanu</text>

        <!-- Client Persona Badges -->
        <rect x="60" y="190" width="180" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="70" y="210" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif" font-weight="500">Pencari Kerja (Job Seeker)</text>
        <text x="70" y="224" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Upload CV, Koreksi, Lamar Loker</text>

        <rect x="60" y="250" width="180" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="70" y="270" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif" font-weight="500">Pemberi Kerja (Employer)</text>
        <text x="70" y="284" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Pasang Lowongan, Review Pelamar</text>

        <!-- NODE 2: Backend API (Express) -->
        <rect x="350" y="90" width="220" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="360" y="100" width="70" height="13" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="395" y="109" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">REST SERVER</text>
        <text x="360" y="132" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Backend API (Express)</text>
        <text x="360" y="148" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">JWT Auth · RBAC · Jobs CRUD</text>
        <text x="360" y="160" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace">Lead: M. Gilang Ramadhan</text>

        <!-- NODE 3: Job Queue (pg-boss / BullMQ) -->
        <rect x="370" y="230" width="180" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="380" y="240" width="60" height="13" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="410" y="249" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TASK QUEUE</text>
        <text x="380" y="270" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Async Job Queue</text>
        <text x="380" y="286" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">pg-boss / Redis BullMQ</text>

        <!-- NODE 4: AI Worker Service (FastAPI) [FOCAL NODE 1 - ACCENT] -->
        <rect x="350" y="360" width="220" height="90" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.4" fill-opacity="0.06"/>
        <rect x="360" y="370" width="76" height="13" rx="2" fill="#2563eb"/>
        <text x="398" y="379" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">AI ENGINE</text>
        <text x="360" y="402" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">FastAPI Worker Service</text>
        <text x="360" y="418" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">PyPDF · Docx · Prompt Parser</text>
        <text x="360" y="432" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Two-Stage Matching Evaluator</text>
        <text x="360" y="444" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace">Lead: Florensius Panca Gati</text>

        <!-- NODE 5: PostgreSQL + pgvector [FOCAL NODE 2] -->
        <rect x="750" y="90" width="210" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="760" y="100" width="70" height="13" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="795" y="109" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">DATABASE</text>
        <text x="760" y="130" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">PostgreSQL + pgvector</text>
        <text x="760" y="146" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">10 Tabel Relasional · HNSW Index</text>
        <text x="760" y="160" fill="#10b981" font-size="8" font-family="'Geist Mono', monospace">Free Tier (Supabase/Neon)</text>

        <!-- NODE 6: Private Object Storage -->
        <rect x="750" y="240" width="210" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="760" y="250" width="74" height="13" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="797" y="259" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STORAGE</text>
        <text x="760" y="280" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Private Object Storage</text>
        <text x="760" y="296" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">Supabase Storage / Cloudflare R2</text>
        <text x="760" y="308" fill="#10b981" font-size="8" font-family="'Geist Mono', monospace">Pre-signed URL (15 min) · Free</text>

        <!-- NODE 7: Google Gemini AI & Embedding API -->
        <rect x="750" y="360" width="210" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="760" y="370" width="80" height="13" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="800" y="379" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">AI PROVIDER</text>
        <text x="760" y="400" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Google Gemini API</text>
        <text x="760" y="416" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">LLM Extraction, Scoring &amp; Embedding</text>
        <text x="760" y="428" fill="#10b981" font-size="8" font-family="'Geist Mono', monospace">Free Tier (15 RPM Gratis)</text>

        <!-- NODE 8: Jooble Publisher API -->
        <rect x="750" y="470" width="210" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="760" y="480" width="86" height="13" rx="2" fill="#0f172a" fill-opacity="0.06"/>
        <text x="803" y="489" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">JOB AGGREGATOR</text>
        <text x="760" y="510" fill="#0f172a" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Jooble Publisher API</text>
        <text x="760" y="525" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">Penarikan Lowongan Resmi Eksternal</text>
      </svg>
